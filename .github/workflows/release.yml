name: Release

on:
  push:
    tags: ['v*']

# Least privilege by default; the publish job opts up to contents: write.
permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
            rust-targets: aarch64-apple-darwin
          - os: macos-latest
            target: x86_64-apple-darwin
            rust-targets: x86_64-apple-darwin
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            rust-targets: x86_64-unknown-linux-gnu
          - os: ubuntu-24.04-arm   # native arm64 runner (free for public repos)
            target: aarch64-unknown-linux-gnu
            rust-targets: aarch64-unknown-linux-gnu
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            rust-targets: x86_64-pc-windows-msvc
          - os: windows-11-arm   # native arm64 runner (cross from x64 needs ARM MSVC components)
            target: aarch64-pc-windows-msvc
            rust-targets: aarch64-pc-windows-msvc
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # xdg-utils: the AppImage bundler copies /usr/bin/xdg-open into the
      # bundle; the arm64 runner image ships without it (x64 has it).
      - name: Install Tauri Linux dependencies
        if: startsWith(matrix.os, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev build-essential curl wget file \
            libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev patchelf \
            xdg-utils
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-targets }}
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: ${{ matrix.target }}
      - run: npm ci
      - name: Build bundle
        run: npm run tauri build -- --target ${{ matrix.target }}
      - uses: actions/upload-artifact@v4
        with:
          name: syzify-${{ matrix.target }}
          path: src-tauri/target/${{ matrix.target }}/release/bundle/
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Create release and attach installers
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mapfile -t files < <(find artifacts -type f \
            \( -name '*.dmg' -o -name '*.deb' -o -name '*.AppImage' \
               -o -name '*.msi' -o -name '*-setup.exe' \))
          if [ ${#files[@]} -eq 0 ]; then
            echo "no installers found to publish" >&2
            exit 1
          fi
          # Idempotent: re-running the tag updates assets instead of failing.
          if gh release view "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            gh release upload "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" --clobber "${files[@]}"
          else
            gh release create "${GITHUB_REF_NAME}" \
              --repo "${GITHUB_REPOSITORY}" \
              --title "${GITHUB_REF_NAME}" \
              --generate-notes \
              "${files[@]}"
          fi
