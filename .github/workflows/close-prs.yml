name: Close pull requests

# Syzify is open source, but not open contribution (see CONTRIBUTING.md).
# GitHub offers no setting to disable pull requests, so we close them
# automatically.

on:
  pull_request_target:
    types: [opened, reopened]

permissions:
  pull-requests: write

jobs:
  close:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const number = context.payload.pull_request.number;
            await github.rest.issues.createComment({
              owner, repo, issue_number: number,
              body: [
                'Thanks for your interest in Syzify! This project is',
                '*open source, but not open contribution* — pull requests are',
                'not accepted, so this PR has been closed automatically (see',
                '[CONTRIBUTING.md](../blob/main/CONTRIBUTING.md)).',
                '',
                'Bug reports and ideas are always welcome in the issues. And if',
                'you want to write code, the Plugin API lets you build your own',
                'plugins under any license you choose.',
              ].join('\n'),
            });
            await github.rest.pulls.update({ owner, repo, pull_number: number, state: 'closed' });