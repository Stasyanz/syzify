<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Syzify</title>
    <!-- Boot splash: pulsing app logo shown while the JS bundle loads, replaced
         the moment React mounts into #root. CSS-only (CSP forbids inline JS);
         background theme via prefers-color-scheme since the .dark class isn't
         set yet. Colors mirror the --bg tokens in App.css; the logo is the
         inline copy of src-tauri/icons/app-icon.svg (dark tile works on both
         themes). The boot-logo class is reused by the React loading state in
         App.tsx — these styles stay in <head> after mount. -->
    <style>
      html,
      body,
      #root {
        height: 100%;
        margin: 0;
      }
      .boot {
        height: 100%;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #f3efe7;
      }
      .boot-logo {
        animation: boot-pulse 1.6s ease-in-out infinite;
      }
      @keyframes boot-pulse {
        0%,
        100% {
          transform: scale(1);
          opacity: 1;
        }
        50% {
          transform: scale(0.9);
          opacity: 0.8;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .boot-logo {
          animation: none;
        }
      }
      @media (prefers-color-scheme: dark) {
        .boot {
          background: #16130e;
        }
      }
    </style>
  </head>

  <body>
    <div id="root">
      <div class="boot">
        <!-- Inline copy of src-tauri/icons/app-icon.svg — keep in sync. -->
        <svg class="boot-logo" viewBox="0 0 1024 1024" width="72" height="72" aria-hidden="true">
          <rect x="0" y="0" width="1024" height="1024" rx="205" ry="205" fill="#221f1a" />
          <g transform="translate(160,72) scale(22)">
            <path d="M2 32 L10 16 L15 20 L23 8 L30 32 Z" fill="#f2ece0" stroke-linejoin="round" />
            <circle cx="17.6" cy="9.8" r="3.2" fill="#ef6a2c" />
          </g>
        </svg>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
