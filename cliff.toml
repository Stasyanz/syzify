# git-cliff configuration — drafts the next release's section from Conventional
# Commits. Optional tool: `cargo install git-cliff` (or brew). Used by
# scripts/release.sh as `git cliff --unreleased --strip all` (section body only);
# NEVER regenerate the whole file with `-o` — the public git history starts at
# v0.26.0, so the earlier sections exist only in the committed CHANGELOG.md.

[changelog]
header = """
# Changelog

All notable changes to Syzify are documented here.
Format: [Keep a Changelog](https://keepachangelog.com/); versioning: [SemVer](https://semver.org/).
Pre-1.0: minor = new feature, patch = fix. This changelog starts at 0.25.0.

"""
body = """
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group | upper_first }}
{% for commit in commits %}
- {{ commit.message | upper_first }}{% endfor %}
{% endfor %}
"""
trim = true

[git]
conventional_commits = true
filter_unconventional = true
split_commits = false
# Conventional types -> changelog sections.
commit_parsers = [
    { message = "^feat", group = "Added" },
    { message = "^fix", group = "Fixed" },
    { message = "^refactor", group = "Changed" },
    { message = "^perf", group = "Performance" },
    { message = "^docs", group = "Documentation" },
    { message = "^chore\\(release\\)", skip = true },
    { message = "^chore|^ci|^test|^style|^build", skip = true },
    { message = "^Merge", skip = true },
]
protect_breaking_commits = true
filter_commits = false
tag_pattern = "v[0-9]*"
topo_order = false
sort_commits = "oldest"
